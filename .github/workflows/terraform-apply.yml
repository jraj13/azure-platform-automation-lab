name: Azure Terraform Apply

on:
  workflow_dispatch:
    inputs:
      confirm_apply:
        description: "Type APPLY to confirm infrastructure deployment"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    environment:
      name: production

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Validate confirmation
        shell: bash
        run: |
          if [ "${{ inputs.confirm_apply }}" != "APPLY" ]; then
            echo "Deployment confirmation failed."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: |
          terraform plan \
            -input=false \
            -out=tfplan \
            -var="storage_account_name=${{ vars.AZURE_STORAGE_ACCOUNT_NAME }}"

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan